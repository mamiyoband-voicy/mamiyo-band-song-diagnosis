<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>いまの私に、マミヨバンド。｜気分で選ぶ5問診断</title>
  <meta name="description" content="いまの気分から、マミヨバンドのおすすめ曲へ出会う5問診断。">
  <style>
    :root { --ink:#241b22; --muted:#735f6b; --bg:#f6f0ec; --paper:#fffdfa; --wine:#78223d; --rose:#c74e6a; --pink:#f8dce2; --gold:#c98d45; --line:#eadbd4; --shadow:0 22px 60px rgba(74,25,45,.16); }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,rgba(234,183,125,.5),transparent 25rem),radial-gradient(circle at 0% 55%,rgba(211,95,123,.18),transparent 27rem),var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}.wrap{width:min(100% - 30px,760px);margin:auto;padding:52px 0 36px}.hero{text-align:center;margin:0 auto 30px;max-width:650px}.eyebrow{display:inline-block;font-size:.77rem;letter-spacing:.15em;font-weight:900;color:var(--rose)}h1{margin:10px 0 12px;font-size:clamp(2.05rem,7.4vw,3.6rem);letter-spacing:-.07em;line-height:1.1;text-wrap:pretty}h1 em{display:block;color:var(--wine);font-style:normal}.lead{margin:0;color:var(--muted);font-size:1rem}.caption{display:inline-block;margin-top:17px;padding:7px 12px;border:1px solid #e8ccc1;border-radius:99px;background:rgba(255,255,255,.72);font-size:.78rem;color:#7c5556}.card,.result{overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--paper);box-shadow:var(--shadow)}.top{padding:20px 24px 16px;border-bottom:1px solid var(--line)}.counter{font-size:.78rem;font-weight:900;letter-spacing:.12em;color:var(--muted)}.progress{height:5px;margin-top:12px;overflow:hidden;border-radius:99px;background:#f0e6e1}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .25s ease}.question{padding:30px 24px 26px}.question-tag{font-size:.78rem;font-weight:900;letter-spacing:.13em;color:var(--rose)}h2{margin:5px 0 21px;font-size:clamp(1.25rem,4.2vw,1.65rem);line-height:1.48;letter-spacing:-.025em;text-wrap:pretty}.choices{display:grid;gap:11px}.choice{display:flex;width:100%;min-height:65px;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid #e5d8d2;border-radius:15px;background:#fff;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:.16s ease}.choice:hover{transform:translateY(-1px);border-color:#d68ca0;background:#fff9f9}.choice:focus-visible{outline:3px solid rgba(199,78,106,.45);outline-offset:2px}.choice.selected{border-color:var(--wine);background:var(--pink);box-shadow:inset 0 0 0 1px var(--wine)}.key{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:50%;color:#fff;background:var(--wine);font-family:Georgia,serif;font-weight:700}.choice span:last-child{font-size:.95rem;line-height:1.5}.actions{display:flex;justify-content:space-between;gap:11px;margin-top:23px}.btn{min-height:46px;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer}.btn.secondary{color:var(--wine);background:#f3e9e8}.btn.primary{color:#fff;background:linear-gradient(100deg,var(--wine),#a83a59)}.btn:disabled{opacity:.42;cursor:not-allowed}.result{display:none}.result.show{display:block;animation:up .3s ease}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.result-hero{padding:32px 26px;color:#fff;background:linear-gradient(135deg,#461126,var(--wine) 56%,#b55a5e)}.result-hero .eyebrow{color:#ffd9a3}.result-hero h2{margin:6px 0 5px;font-size:clamp(1.75rem,6vw,2.8rem);line-height:1.15}.result-body{padding:27px 26px 30px}.song{margin:18px 0;padding:21px;border-radius:18px;background:linear-gradient(135deg,#fff1f3,#fff9ee);border:1px solid #ecd4c8}.song small{display:block;color:var(--rose);font-weight:900;letter-spacing:.1em}.song h3{margin:4px 0 5px;color:var(--wine);font-size:1.6rem;line-height:1.25}.song p{margin:0;font-size:.92rem}.result-body>h3{margin:22px 0 6px;color:var(--wine);font-size:.89rem;letter-spacing:.1em}.result-body>p{margin:0}.listen{display:grid;gap:10px;margin-top:18px}.listen a{display:block;border-radius:12px;padding:13px 16px;text-align:center;text-decoration:none;font-weight:900}.free{color:#fff;background:var(--wine)}.paid{color:var(--wine);background:#f6ecdf;border:1px solid #e3cba8}.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}.count{padding:9px 4px;border-radius:11px;background:#f8f4f2;text-align:center}.count b{display:block;color:var(--wine);line-height:1.1;font-size:1.1rem}.count small{font-size:.66rem;color:var(--muted)}.notice{margin-top:23px;padding:16px;border-radius:15px;background:#f4efed;color:var(--muted);font-size:.82rem}footer{margin-top:25px;color:var(--muted);text-align:center;font-size:.73rem}@media(max-width:480px){.wrap{width:min(100% - 20px,760px);padding-top:31px}.top,.question,.result-body{padding-left:18px;padding-right:18px}.result-hero{padding:27px 19px}.choice{min-height:70px}.actions{gap:8px}.btn{padding:10px 13px}.counts{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    /* Transformed from the official visual vocabulary: black stage, deep red chairs, silver logotype glow. */
    :root{--ink:#f8f5f3;--muted:#b8afb2;--bg:#050505;--paper:#111012;--wine:#c10d27;--rose:#ea4d61;--pink:#35131b;--gold:#d7c9c9;--line:#3d383a;--shadow:0 22px 64px rgba(0,0,0,.58)}
    body{overflow-x:hidden;background:radial-gradient(ellipse at 85% 8%,rgba(191,9,32,.32),transparent 24rem),radial-gradient(ellipse at 10% 70%,rgba(119,0,19,.25),transparent 28rem),#050505;color:var(--ink)}
    body::before{width:48vw;height:48vw;right:-20vw;top:12vh;background:radial-gradient(circle,rgba(199,17,42,.32),transparent 68%);opacity:1}
    .wrap{padding-top:38px}.hero{position:relative;overflow:hidden;text-align:left;padding:36px 34px 32px;border-left:1px solid #6b1b29;background:linear-gradient(105deg,rgba(9,9,10,.96),rgba(30,8,13,.8));box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)}
    .hero::after{content:"MAMIYO BAND";position:absolute;right:18px;bottom:11px;color:rgba(255,255,255,.08);font-family:Georgia,serif;font-size:clamp(1.7rem,6vw,3.8rem);letter-spacing:.1em;pointer-events:none}.eyebrow{color:#f55a6e}.hero h1{color:#fff;font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;letter-spacing:.01em}.hero h1 em{display:block;white-space:nowrap;word-break:keep-all;color:#e4dcde;font-style:italic}.lead{max-width:525px;color:#c7bec0}.caption{border-color:#61303a;background:rgba(193,13,39,.12);color:#e9dfe1}
    .card,.result{border-color:#393437;background:#111012;box-shadow:var(--shadow)}.top{border-color:#393437;background:#0d0c0e}.counter{color:#c1b8ba}.progress{background:#2c2729}.progress span{background:linear-gradient(90deg,#8d0d22,#e44857,#ddd1d3)}.question-tag{color:#f35a6f}h2{color:#fff}.choice{border-color:#3e373a;background:#171517;color:#f5eef0}.choice:hover{border-color:#a1263a;background:#251116}.choice.selected{border-color:#e14357;background:#35131b;box-shadow:inset 0 0 0 1px #e14357}.key{background:linear-gradient(135deg,#760914,#d31731);color:#fff}.btn.secondary{color:#f1dce0;background:#2c2023}.btn.primary{background:linear-gradient(100deg,#8f0a1e,#db263e)}
    .result-hero{background:linear-gradient(125deg,#120b0d,#700d1e 64%,#c91c33)}.result-hero .eyebrow{color:#f7b2bd}.result-body{background:#111012}.song{background:linear-gradient(135deg,#2b1117,#151113);border-color:#64303b}.song small,.result-body>h3{color:#f15c6e}.song h3{color:#fff}.song p,.result-body>p{color:#ded5d7}.free{background:linear-gradient(100deg,#b70e26,#ef4056)}.paid{color:#f5dcdf;background:#211719;border-color:#69333c}.counts .count{background:#1c181a}.count b{color:#f36a79}.count small{color:#c9bfc1}.notice{background:#261719;color:#d4c8ca}footer{color:#9d9094}

  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero"><span class="eyebrow">MAMIYO BAND / SONG FINDER</span><h1>今日の<em>マミヨバンド診断</em></h1><p class="lead">元気を出したい日も、泣きたい日も、もう一度自分の物語を始めたい日も。簡単な5つの問いから、いま聴きたい1曲を見つけよう。</p></header>
    <section class="card" id="quiz" aria-live="polite"><div class="top"><span class="counter" id="counter">QUESTION 1 / 5</span><div class="progress"><span id="bar" style="width:0%"></span></div></div><div class="question" id="question"></div></section>
    <section class="result" id="result" aria-live="polite"></section>
    <footer>いまのあなたに選ばれた一曲を、まずは無料で聴いてみて。</footer>
  </main>
<script type="module">
import { recommend, shuffleQuestions, MODES } from './scoring.js';
const orderedQuestions=[
 ['いま、いちばん近い気持ちは？',[['A','よし、ここから！'],['B','ちょっと疲れた'],['C','考えごとをしている'],['D','うまくいかないこともある'],['E','なにか新しいことを始めたい']]],
 ['いま、どんな時間を過ごしたい？',[['A','ドライブやお出かけをしたい'],['B','部屋でゆっくり過ごしたい'],['C','カフェや部屋で一人になりたい'],['D','夜の散歩をしたい'],['E','何かが始まる前の時間を楽しみたい']]],
 ['いま、耳がときめくのは？',[['A','ギターやドラムの熱'],['B','やさしい歌声'],['C','まっすぐ届く歌詞'],['D','ちょっと不思議でクセになる音'],['E','映画のワンシーンみたいな音']]],
 ['曲を聴き終えたあと、どんな気分になりたい？',[['A','テンションを上げたい！'],['B','少し泣いて、すっきりしたい'],['C','気持ちを整理したい'],['D','今までの自分も悪くなかったと思いたい'],['E','明日が少し楽しみになっていたい']]],
 ['今、誰かにかけてほしい言葉は？',[['A','「いける。行こうぜ！」'],['B','「頑張ってること、ちゃんと分かってるよ」'],['C','「本当は、どうしたい？」'],['D','「そのツギハギも、あなたの宝物だよ」'],['E','「あなたの人生の主人公は、あなた自身だよ」']]],
];
let questions=shuffleQuestions(orderedQuestions);
let step=0;const answers=[];const $=(id)=>document.getElementById(id);
function render(){const [title,choices]=questions[step],shown=choices,last=step===questions.length-1;$('counter').textContent=`QUESTION ${step+1} / ${questions.length}`;$('bar').style.width=`${(step/questions.length)*100}%`;$('question').innerHTML=`<div class="question-tag">いまの気分を選ぶ</div><h2>${title}</h2><div class="choices">${shown.map(([key,text])=>`<button class="choice ${answers[step]===key?'selected':''}" data-choice="${key}"><span class="key">${key}</span><span>${text}</span></button>`).join('')}</div><div class="actions"><button class="btn secondary" id="back" ${step===0?'disabled':''}>← 戻る</button>${last?`<button class="btn primary" id="finish" ${answers.length===5?'':'disabled'}>おすすめ曲を見る</button>`:`<button class="btn primary" id="next" ${answers[step]?'':'disabled'}>次へ →</button>`}</div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{answers[step]=b.dataset.choice;render()}));$('back').addEventListener('click',()=>{if(step){step--;render()}});if(last)$('finish').addEventListener('click',showResult);else $('next').addEventListener('click',()=>{if(answers[step]){step++;render()}})}
function showResult(){const r=recommend(answers),tie=r.tiedKeys.length>1?`<p class="notice">いまは${r.tiedKeys.map(k=>MODES[k].name).join('・')}の両方を求めているみたい。まずはこの1曲から、今の気持ちを確かめてみて。</p>`:'';$('quiz').style.display='none';$('result').innerHTML=`<div class="result-hero"><span class="eyebrow">YOUR MAMIYO BAND MOMENT</span><h2>${r.name}</h2><p>${r.line}</p></div><div class="result-body"><div class="song"><small>いまのあなたへの1曲</small><h3>「${r.song}」</h3><p>${r.note}</p></div><h3>まずは、無料で聴く</h3><p>いまの気持ちに合うか、公式YouTubeの公開映像で確かめてみて。</p><div class="listen"><a class="free" href="${r.freeUrl}" target="_blank" rel="noopener">YouTubeで無料試聴する ↗</a><a class="paid" href="https://linkco.re/qPa6F1zE" target="_blank" rel="noopener">もっと聴く／作品を手元に置く ↗</a></div>${tie}<div class="actions"><button class="btn secondary" id="retry">もう一度選ぶ</button><button class="btn primary" id="share">結果をシェア</button></div></div>`;$('result').classList.add('show');$('retry').addEventListener('click',()=>{answers.length=0;questions=shuffleQuestions(orderedQuestions);step=0;$('result').classList.remove('show');$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'})});$('share').addEventListener('click',async()=>{const shareText=`今日の私に選ばれたマミヨバンドは「${r.song}」\n${r.line}`;try{if(navigator.share){await navigator.share({title:'今日のマミヨバンド診断',text:shareText,url:location.href});$('share').textContent='シェアしました！'}else{await navigator.clipboard.writeText(`${shareText}\n${location.href}`);$('share').textContent='結果をコピーしました！'}}catch(error){if(error?.name!=='AbortError'){$('share').textContent='シェアできませんでした'}}});window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
</body>
</html>
